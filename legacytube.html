<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 3.0//EN">
<html>
<head>
    <title>LegacyTube Kaycrafter</title>
</head>
<body>

    <h1>Старый браузер?</h1>
    
    <p>Тогда вставьте ссылку на видео, поддерживаются только youtube.com, но не youtube.be</p>

    <!-- Форма отправляет пользователя на страницу встраивания, которая легче стандартной -->
    <form action="http://youtube.com" method="GET">
        <p>
            ID видео (например, dQw4w9WgXcQ): <br>
            <input type="text" name="v" size="40">
        </p>
        <p>
            <input type="submit" value="Открыть видеоплеер">
        </p>
    </form>

    <hr>

    <h2></h2>
    <ul>
        <li></li>
        <li></li>
    </ul>

</body>
</html>

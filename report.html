<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправить репорт kaycrafter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #333; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; width: 340px; }
        textarea { width: 100%; height: 120px; background-color: #444; border: 1px solid #555; border-radius: 4px; color: #fff; padding: 12px; font-size: 14px; resize: none; box-sizing: border-box; transition: border-color 0.3s; margin: 10px 0; }
        textarea:focus { border-color: #28a745; outline: none; }
        textarea::placeholder { color: #aaa; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover:not(:disabled) { background: #218838; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .alert { padding: 12px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; text-align: left; line-height: 1.4; display: none; }
        .error { background: #dc3545; border-left: 5px solid #bd2130; display: block; }
        .success { background: #28a745; border-left: 5px solid #1e7e34; display: block; }
        h2 { margin-top: 0; color: #28a745; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #28a745; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Оставить репорт</h2>
    
    <!-- Блок вывода уведомлений -->
    <div id="alert-box" class="alert"></div>

    <form id="report-form">
        <!-- Ограничение на 500 символов, чтобы не слали текстовые бомбы -->
        <textarea id="report-text" placeholder="Опишите вашу проблему" required maxlength="500" autocomplete="off"></textarea>
        <button type="submit" id="submit-btn">Отправить репорт</button>
    </form>

    <a href="index.html" class="back-link">← Назад на главную</a>
</div>

<script>
    // ⚠️ НАСТРОЙКА: Вставьте сюда URL вашего вебхука из настроек Discord
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1539842891856224287/FCC21-N1QJvtMC4m1JXb5tZ16bFwwjZXQhZnJClpGyzZWR80sPifgvXSLH0g0OS68vfW'; 
    const COOLDOWN_SECONDS = 540; // 9 минут

    // Регулярное выражение для базовой фильтрации нецензурных слов на входе
    const badWordsRegex = /хуй|хуе|хуя|пизд|еба|ёба|бля|сука|гондо|гандо|муда|пидо|пидр|ублю|дроч|залуп/i;

    const form = document.getElementById('report-form');
    const textarea = document.getElementById('report-text');
    const submitBtn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');

    // Проверка блокировки при загрузке страницы
    function checkCooldown() {
        const lastSubmit = localStorage.getItem('last_report_submit');
        if (lastSubmit) {
            const timePassed = Math.floor(Date.now() / 1000) - parseInt(lastSubmit);
            if (timePassed < COOLDOWN_SECONDS) {
                const timeLeft = COOLDOWN_SECONDS - timePassed;
                blockButton(timeLeft);
            }
        }
    }

    // Блокировка кнопки и запуск обратного отсчета
    function blockButton(seconds) {
        submitBtn.disabled = true;
        let counter = seconds;
        
        showAlert(`Повторный репорт возможен через ${formatTime(counter)}`, 'error');

        const interval = setInterval(() => {
            counter--;
            if (counter <= 0) {
                clearInterval(interval);
                submitBtn.disabled = false;
                alertBox.style.display = 'none';
                submitBtn.innerText = 'Отправить репорт';
            } else {
                showAlert(`Повторный репорт возможен через ${formatTime(counter)}`, 'error');
                submitBtn.innerText = `Подождите (${formatTime(counter)})`;
            }
        }, 1000);
    }

    // Форматирование секунд в минуты и секунды (09:00)
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function showAlert(text, type) {
        alertBox.innerText = text;
        alertBox.className = `alert ${type}`;
    }

    // Отправка формы напрямую в Discord вебхук
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const text = textarea.value.trim();

        // Защита от пустых отправлений
        if (!text) return;

        // Фильтрация мата перед отправкой для защиты сервера
        if (badWordsRegex.test(text)) {
            showAlert('Ваше сообщение содержит недопустимые слова!', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Отправка...';

        // Форматируем красивую карточку-сообщение (Embed) для Discord
        const discordPayload = {
            embeds: [{
                title: "📌 Новое сообщение (Репорт)",
                color: 15158332, // Цвет полоски (красноватый #e74c3c)
                fields: [
                    { name: "Содержимое репорта", value: text }
                ],
                footer: { text: "Отправлено напрямую с GitHub Pages" },
                timestamp: new Date().toISOString()
            }]
        };

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(discordPayload)
            });

            if (response.ok || response.status === 204) {
                showAlert('Репорт успешно отправлен!', 'success');
                textarea.value = '';
                
                // Запоминаем время отправки для таймера
                localStorage.setItem('last_report_submit', Math.floor(Date.now() / 1000).toString());
                blockButton(COOLDOWN_SECONDS);
            } else {
                showAlert('Произошла ошибка, включите VPN и попробуйте снова.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить репорт';
            }
        } catch (err) {
            showAlert('Ошибка сети. Проверьте соединение с интернетом и включите VPN, если вы из РФ.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Отправить репорт';
        }
    });

    // Запуск проверки кулдауна при открытии страницы
    checkCooldown();
</script>

</body>
</html>

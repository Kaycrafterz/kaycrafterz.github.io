<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaycrafter Snake</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="score">Счёт: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            alert('Ваш браузер не поддерживает WebGL!');
        }

        // --- Настройки игры ---
        const GRID_SIZE = 20; // Размер сетки (20x20 ячеек)
        const TILE_SIZE = canvas.width / GRID_SIZE;
        
        let snake = [{x: 10, y: 10}];
        let direction = {x: 0, y: 0};
        let nextDirection = {x: 0, y: 0};
        let food = {x: 5, y: 5};
        let score = 0;
        let gameOver = false;
        
        // Таймер для контроля скорости игры (движение раз в 100 мс)
        let lastMoveTime = 0;
        const moveInterval = 100; 

        // --- WebGL Шейдеры ---
        const vsSource = `
            attribute vec2 a_position;
            uniform vec2 u_resolution;
            void main() {
                // Преобразуем координаты из пикселей в диапазон от 0.0 до 1.0
                vec2 zeroToOne = a_position / u_resolution;
                // Преобразуем из 0->1 в 0->2
                vec2 zeroToTwo = zeroToOne * 2.0;
                // Преобразуем из 0->2 в -1->+1 (пространство clip space)
                vec2 clipSpace = zeroToTwo - 1.0;
                // Инвертируем Y, чтобы верх был вверху
                gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
            }
        `;

        const fsSource = `
            precision mediump float;
            uniform vec4 u_color;
            void main() {
                gl_FragColor = u_color;
            }
        `;

        // Инициализация шейдеров
        function initShaderProgram(gl, vsSource, fsSource) {
            const loadShader = (gl, type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            };
            const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            return program;
        }

        const program = initShaderProgram(gl, vsSource, fsSource);
        gl.useProgram(program);

        // Получение локаций переменных в шейдерах
        const positionAttributeLocation = gl.getAttribLocation(program, "a_position");
        const resolutionUniformLocation = gl.getUniformLocation(program, "u_resolution");
        const colorUniformLocation = gl.getUniformLocation(program, "u_color");

        // Создание буфера для координат квадратов
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.enableVertexAttribArray(positionAttributeLocation);
        gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

        // Установка разрешения экрана для шейдера
        gl.uniform2f(resolutionUniformLocation, canvas.width, canvas.height);

        // Функция отрисовки одного квадрата (ячейки)
        function drawRect(x, y, width, height, color) {
            gl.uniform4fv(colorUniformLocation, color);
            
            const x1 = x;
            const x2 = x + width;
            const y1 = y;
            const y2 = y + height;

            // Передаем геометрию двух треугольников, из которых состоит квадрат
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                x1, y1,
                x2, y1,
                x1, y2,
                x1, y2,
                x2, y1,
                x2, y2,
            ]), gl.STATIC_DRAW);

            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }

        // --- Логика игры ---
        
        function spawnFood() {
            food.x = Math.floor(Math.random() * GRID_SIZE);
            food.y = Math.floor(Math.random() * GRID_SIZE);
            // Проверка, чтобы еда не спавнилась внутри змейки
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function updateGame() {
            if (gameOver) return;

            // Фиксируем направление движения
            direction = nextDirection;

            // Если игра еще не началась (стоим на месте)
            if (direction.x === 0 && direction.y === 0) return;

            // Рассчитываем новую голову
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver = true;
                alert(`Игра окончена! Ваш счёт: ${score}. Нажмите F5 для перезапуска.`);
                return;
            }

            // Проверка столкновения с самим собой
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver = true;
                    alert(`Игра окончена! Вы врезались в себя. Нажмите F5.`);
                    return;
                }
            }

            // Добавляем новую голову в начало
            snake.unshift(head);

            // Проверка: съели ли мы еду?
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = `Счёт: ${score}`;
                spawnFood();
            } else {
                // Если не съели, убираем хвост
                snake.pop();
            }
        }

        // --- Рендеринг сцены ---
        function render() {
            // Очистка экрана (черный цвет)
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Рисуем еду (Красный цвет: R=1, G=0.2, B=0.2)
            drawRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1, [1.0, 0.2, 0.2, 1.0]);

            // Рисуем змейку (Зеленый цвет: R=0.2, G=0.8, B=0.2)
            for (let i = 0; i < snake.length; i++) {
                // Голову сделаем чуть ярче тела
                const color = i === 0 ? [0.3, 1.0, 0.3, 1.0] : [0.2, 0.8, 0.2, 1.0];
                drawRect(snake[i].x * TILE_SIZE, snake[i].y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1, color);
            }
        }

        // Основной игровой цикл
        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);

            // Управляем частотой обновления логики
            if (currentTime - lastMoveTime >= moveInterval) {
                updateGame();
                lastMoveTime = currentTime;
            }

            // Отрисовка происходит каждый кадр (обычно 60fps) для плавности
            render();
        }

        // --- Обработка управления ---
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            
            // Защита от разворота на 180 градусов в себя
            if ((key === 'arrowup' || key === 'w') && direction.y !== 1) {
                nextDirection = {x: 0, y: -1};
            } else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) {
                nextDirection = {x: 0, y: 1};
            } else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) {
                nextDirection = {x: -1, y: 0};
            } else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) {
                nextDirection = {x: 1, y: 0};
            }
        });

        // Старт игры
        spawnFood();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

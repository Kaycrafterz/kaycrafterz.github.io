<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор Kaycrafter</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; font-family: sans-serif; }
        .calculator { background-color: #1c1c1c; padding: 20px; border-radius: 20px; width: 320px; }
        #display { width: 100%; height: 70px; background: transparent; color: white; border: none; font-size: 2.5rem; text-align: right; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 1.5rem; border: none; border-radius: 50%; cursor: pointer; }
        .btn-number { background-color: #333; color: white; }
        .btn-operator { background-color: #ff9f0a; color: white; }
        #equals { grid-column: span 2; border-radius: 40px; background-color: #ff9f0a; color: white; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendOperator('/')">/</button>
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <!-- Добавьте остальные кнопки аналогично, полный код в источнике -->
            <button id="equals" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        let currentInput = '';
        function appendNumber(num) { currentInput += num; display.value = currentInput; }
        function appendOperator(op) { currentInput += op; display.value = currentInput; }
        function clearDisplay() { currentInput = ''; display.value = ''; }
        function calculate() { try { display.value = eval(currentInput); currentInput = display.value; } catch { display.value = 'Ошибка'; } }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор Kaycrafter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; font-family: sans-serif; }
        .calculator { background-color: #1c1c1c; padding: 20px; border-radius: 20px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #display { width: 100%; height: 70px; background: transparent; color: white; border: none; font-size: 2.5rem; text-align: right; margin-bottom: 20px; padding: 0 10px; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 1.5rem; border: none; border-radius: 50%; cursor: pointer; transition: filter 0.1s; display: flex; justify-content: center; align-items: center; }
        button:active { filter: brightness(1.3); }
        .btn-clear { background-color: #a5a5a5; color: black; }
        .btn-number { background-color: #333; color: white; }
        .btn-operator { background-color: #ff9f0a; color: white; }
        #equals { grid-column: span 2; border-radius: 40px; background-color: #ff9f0a; color: white; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <!-- Строка 1 -->
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-operator" onclick="appendOperator('/')">/</button>
            <button class="btn-operator" onclick="appendOperator('*')">*</button>
            <button class="btn-operator" onclick="appendOperator('-')">-</button>
            
            <!-- Строка 2 -->
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>
            
            <!-- Строка 3 -->
            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-number" onclick="appendNumber('.')">.</button>
            
            <!-- Строка 4 -->
            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-number" onclick="appendNumber('0')">0</button>
            
            <!-- Строка 5 -->
            <button id="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.value = currentInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' && num !== '.' || shouldResetDisplay) {
                currentInput = num;
                shouldResetDisplay = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return; // Защита от двойной точки
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op; // Замена оператора, если он уже нажат
            } else {
                currentInput += op;
            }
            shouldResetDisplay = false;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            try {
                // Безопасное вычисление базовых выражений без eval() через Function
                const result = new Function(`return ${currentInput}`)();
                currentInput = Number(result.toFixed(8)).toString(); // Округление для избежания проблем с 0.1 + 0.2
                shouldResetDisplay = true;
            } catch {
                currentInput = 'Ошибка';
                shouldResetDisplay = true;
            }
            updateDisplay();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор Kaycrafter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; font-family: sans-serif; }
        
        /* Основной контейнер калькулятора */
        .calculator { background-color: #1c1c1c; padding: 24px; border-radius: 24px; width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        /* Дисплей */
        #display { width: 100%; height: 80px; background: transparent; color: white; border: none; font-size: 3rem; text-align: right; margin-bottom: 15px; padding: 0 10px; outline: none; }
        
        /* Сетка кнопок */
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        
        /* Общие стили для круглых кнопок */
        button { width: 100%; aspect-ratio: 1; font-size: 1.6rem; font-weight: bold; border: none; border-radius: 50%; cursor: pointer; transition: background-color 0.1s; display: flex; justify-content: center; align-items: center; }
        button:active { filter: brightness(1.3); }
        
        /* Цвета кнопок */
        .btn-clear { background-color: #a5a5a5; color: black; }
        .btn-number { background-color: #333; color: white; }
        .btn-operator { background-color: #ff9f0a; color: white; }
        
        /* Кнопка «равно» в форме капсулы */
        #equals { grid-column: span 2; aspect-ratio: auto; height: 100%; border-radius: 40px; background-color: #ff9f0a; color: white; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <!-- Строка 1 -->
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-operator" onclick="appendOperator('/')">/</button>
            <button class="btn-operator" onclick="appendOperator('*')">*</button>
            <button class="btn-operator" onclick="appendOperator('-')">-</button>
            
            <!-- Строка 2 -->
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>
            
            <!-- Строка 3 -->
            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-number" onclick="appendNumber('.')">.</button>
            
            <!-- Строка 4 -->
            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-number" onclick="appendNumber('0')">0</button>
            
            <!-- Строка 5 -->
            <button id="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() { display.value = currentInput; }
        function appendNumber(num) {
            if (currentInput === '0' && num !== '.' || shouldResetDisplay) { currentInput = num; shouldResetDisplay = false; } 
            else { if (num === '.' && currentInput.includes('.')) return; currentInput += num; }
            updateDisplay();
        }
        function appendOperator(op) {
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) { currentInput = currentInput.slice(0, -1) + op; } 
            else { currentInput += op; }
            shouldResetDisplay = false;
            updateDisplay();
        }
        function clearDisplay() { currentInput = '0'; updateDisplay(); }
        function calculate() {
            try {
                const result = new Function(`return ${currentInput}`)();
                currentInput = Number(result.toFixed(8)).toString();
                shouldResetDisplay = true;
            } catch { currentInput = 'Ошибка'; shouldResetDisplay = true; }
            updateDisplay();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пингер серверов майнкрафт</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-lime-400">⛏️ MC Server Checker</h1>
        
        <!-- Форма ввода -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="serverIp" placeholder="mc.hypixel.net" 
                   class="flex-1 bg-slate-950 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-lime-500">
            <button onclick="checkServer()" id="btn" 
                    class="bg-lime-500 hover:bg-lime-600 text-slate-900 font-bold px-4 py-2 rounded-lg transition-colors cursor-pointer">
                Пинг
            </button>
        </div>

        <div id="loader" class="hidden text-center text-slate-400 my-4 animate-pulse">Опрашиваю сервер...</div>

        <div id="result" class="hidden bg-slate-950 rounded-xl p-4 border border-slate-700">
            <div class="flex items-center gap-4 mb-3">
                <!-- Сюда вставим аватарку сервера -->
                <img id="serverIcon" class="w-12 h-12 rounded bg-slate-800 hidden" alt="Icon">
                <div>
                    <div id="statusBadge" class="inline-block text-xs font-bold px-2 py-0.5 rounded-full mb-1"></div>
                    <h2 id="serverName" class="font-mono text-sm text-slate-300"></h2>
                </div>
            </div>
            
            <!-- Инфо об игроках -->
            <div id="playerInfo" class="text-sm text-slate-400 mb-2"></div>
            
            <!-- Версия игры -->
            <div id="versionInfo" class="text-xs text-slate-500 font-mono"></div>
        </div>
    </div>

    <script>
        async function checkServer() {
            const ip = document.getElementById('serverIp').value.trim();
            if (!ip) return alert('Введите IP адрес сервера!');

            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('result');
            const btn = document.getElementById('btn');

            // Включаем режим загрузки
            loader.classList.remove('hidden');
            resultCard.classList.add('hidden');
            btn.disabled = true;

            try {
                // Делаем запрос к бесплатному публичному API
                const response = await fetch(`https://mcsrvstat.us{ip}`);
                const data = await response.json();

                loader.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const statusBadge = document.getElementById('statusBadge');
                const serverName = document.getElementById('serverName');
                const serverIcon = document.getElementById('serverIcon');
                const playerInfo = document.getElementById('playerInfo');
                const versionInfo = document.getElementById('versionInfo');

                serverName.innerText = ip;

                if (data.online) {
                    // Если сервер онлайн
                    statusBadge.innerText = 'ONLINE';
                    statusBadge.className = 'inline-block text-xs font-bold px-2 py-0.5 rounded-full mb-1 bg-lime-500/20 text-lime-400';
                    
                    // Выводим игроков
                    playerInfo.innerText = `Игроки: ${data.players.online} / ${data.players.max}`;
                    // Выводим версию игры
                    versionInfo.innerText = `Версия: ${data.version || 'Неизвестно'}`;

                    // Если у сервера есть кастомная иконка, показываем её
                    if (data.icon) {
                        serverIcon.src = data.icon;
                        serverIcon.classList.remove('hidden');
                    } else {
                        serverIcon.classList.add('hidden');
                    }
                } else {
                    // Если сервер оффлайн
                    statusBadge.innerText = 'OFFLINE';
                    statusBadge.className = 'inline-block text-xs font-bold px-2 py-0.5 rounded-full mb-1 bg-red-500/20 text-red-400';
                    playerInfo.innerText = 'Сервер недоступен или указан неверный IP';
                    versionInfo.innerText = '';
                    serverIcon.classList.add('hidden');
                }

            } catch (error) {
                console.error(error);
                alert('Ошибка при выполнении запроса к API.');
                loader.classList.add('hidden');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
